<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>［屋号］｜外構・エクステリア</title>
<meta name="description" content="外構・エクステリア工事を、完璧に整えすぎない庭という思想で。［屋号］が、住まいの静けさをかたちにします。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --color-canvas: #E8E9EB;
    --color-plaster: #DADCDE;
    --color-fog-dark: rgba(15, 17, 22, 0.55);
    --color-ink: #14161C;
    --color-ink-soft: #565A5E;
    --color-accent: #26394B;
    --color-hairline: #C7C9CB;
    --color-hairline-dark: rgba(255, 255, 255, 0.14);
    --color-highlight: rgba(255, 255, 255, 0.08);
    --color-on-ink: #ECEDEE;

    --font-heading: "Shippori Mincho", serif;
    --font-body: "Zen Kaku Gothic New", sans-serif;

    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-9: 120px;
    --max-width: 1200px;

    --radius: 0px;
    --motion-duration: 700ms;
    --motion-ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-family: var(--font-heading); font-weight: 400; margin: 0; letter-spacing: -0.01em; }

  a { color: inherit; }

  /* ---------- Scroll progress ---------- */
  .scroll-progress { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: rgba(199,201,203,0.35); z-index: 200; }
  .scroll-progress-bar { height: 100%; width: 100%; background: var(--color-accent); transform: scaleX(var(--sp, 0)); transform-origin: left; }

  /* ---------- Nav ---------- */
  .site-nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
    padding: var(--space-6);
    display: flex; align-items: center; justify-content: space-between;
    color: var(--color-on-ink);
    mix-blend-mode: difference;
  }
  .site-nav .logo {
    font-family: var(--font-heading); font-size: 19px; text-decoration: none;
  }
  .site-nav .nav-contact {
    font-size: 12px; letter-spacing: 0.06em; text-decoration: none;
    border-bottom: 1px solid rgba(236,237,238,0.5);
    padding-bottom: 2px;
    transition: border-color var(--motion-duration) var(--motion-ease);
  }
  .site-nav .nav-contact:hover { border-color: transparent; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    height: 100vh;
    overflow: hidden;
  }
  .hero-media { position: absolute; inset: 0; overflow: hidden; }
  .hero-photo {
    position: absolute; top: -15%; left: 0; width: 100%; height: 130%;
    object-fit: cover;
    transform: translateY(calc(var(--parallax, 0) * 1%));
  }
  .hero-scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(6,7,9,0.88) 0%, rgba(6,7,9,0.5) 30%, transparent 55%),
      linear-gradient(100deg, rgba(6,7,9,0.35) 0%, transparent 40%);
  }

  .hero-eyebrow-vertical {
    position: absolute;
    top: var(--space-9);
    right: var(--space-6);
    z-index: 2;
    writing-mode: vertical-rl;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: rgba(236,237,238,0.55);
  }

  .hero-content {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 2;
    padding: 0 var(--space-6) 96px;
    color: var(--color-on-ink);
  }
  .hero-content h1 {
    font-size: clamp(44px, 9vw, 108px);
    line-height: 1.15;
    max-width: 16em;
  }
  .split-lines .line { display: block; overflow: hidden; }
  .split-lines .line span {
    display: inline-block;
    transform: translateY(110%);
    opacity: 0;
    transition: transform 1s var(--motion-ease), opacity 1s var(--motion-ease);
  }
  .split-lines.in .line:nth-child(1) span { transition-delay: 200ms; }
  .split-lines.in .line:nth-child(2) span { transition-delay: 360ms; }
  .split-lines.in .line span { transform: translateY(0); opacity: 1; }

  .hero-lede {
    max-width: 24em;
    margin: var(--space-6) 0 0 0;
    padding-left: var(--space-6);
    border-left: 1px solid rgba(236,237,238,0.3);
    font-size: 14px;
    line-height: 1.9;
    color: rgba(236,237,238,0.75);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity var(--motion-duration) var(--motion-ease) 650ms, transform var(--motion-duration) var(--motion-ease) 650ms;
  }
  .hero-lede.in { opacity: 1; transform: translateY(0); }

  .hero-foot {
    position: absolute; left: 0; right: 0; bottom: var(--space-6);
    z-index: 2;
    padding: 0 var(--space-6);
    display: flex; align-items: flex-end; justify-content: space-between;
  }

  .cta {
    position: relative;
    display: inline-block;
    padding: 4px 0;
    font-family: var(--font-body);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--color-on-ink);
    text-decoration: none;
    border-bottom: 1px solid rgba(236,237,238,0.5);
    transition: border-color var(--motion-duration) var(--motion-ease), padding-right var(--motion-duration) var(--motion-ease);
    opacity: 0;
    transform: translateY(10px);
  }
  .cta.in { opacity: 1; transform: translateY(0); transition: opacity var(--motion-duration) var(--motion-ease) 850ms, transform var(--motion-duration) var(--motion-ease) 850ms, border-color var(--motion-duration) var(--motion-ease); }
  .cta:hover { border-color: var(--color-on-ink); padding-right: 8px; }

  .scroll-cue {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(236,237,238,0.55);
    display: flex; align-items: center; gap: var(--space-4);
  }
  .scroll-cue::before {
    content: "";
    display: block;
    width: 32px; height: 1px;
    background: rgba(236,237,238,0.4);
  }

  @media (max-width: 640px) {
    .hero-content { padding: 0 var(--space-5) 120px; }
    .hero-content h1 { font-size: 34px; max-width: 11em; }
    .hero-eyebrow-vertical { top: 96px; }
    .hero-foot { padding: 0 var(--space-5); flex-direction: column; align-items: flex-start; gap: var(--space-5); }
  }
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><div class="scroll-progress-bar"></div></div>

<header class="site-nav">
  <a class="logo" href="#">［屋号］</a>
  <a class="nav-contact" href="#contact">お問い合わせ</a>
</header>

<section class="hero">
  <div class="hero-media">
    <img class="hero-photo" src="images/roji-gate-dusk.png" alt="露地の飛び石と、灯りの灯る門" data-parallax>
    <div class="hero-scrim"></div>
  </div>
  <span class="hero-eyebrow-vertical">EXTERIOR / GARDEN DESIGN</span>
  <div class="hero-content">
    <h1 class="split-lines" id="hero-h1">
      <span class="line"><span>庭に、</span></span>
      <span class="line"><span>静けさを設計する。</span></span>
    </h1>
    <p class="hero-lede" id="hero-lede">外構・エクステリア工事を、完璧に整えすぎない庭という思想で。<br>［屋号］が、住まいの静けさをかたちにします。</p>
  </div>
  <div class="hero-foot">
    <a class="cta" id="hero-cta" href="#contact">お問い合わせ</a>
    <span class="scroll-cue">Scroll</span>
  </div>
</section>

<script src="https://unpkg.com/lenis@1/dist/lenis.min.js"></script>
<script>
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!prefersReducedMotion && window.Lenis) {
    window.__lenis = new Lenis({ autoRaf: true });
  }

  const progressBar = document.querySelector('.scroll-progress-bar');
  if (progressBar) {
    const updateProgress = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max > 0 ? window.scrollY / max : 0;
      progressBar.style.setProperty('--sp', p.toFixed(4));
    };
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
  }

  const parallaxEls = document.querySelectorAll('[data-parallax]');
  if (parallaxEls.length && !prefersReducedMotion) {
    const updateParallax = () => {
      const vh = window.innerHeight;
      parallaxEls.forEach(el => {
        const rect = el.parentElement.getBoundingClientRect();
        const centerProgress = (rect.top + rect.height / 2) / vh;
        const clamped = Math.min(Math.max(centerProgress, 0), 1);
        const shift = (clamped - 0.5) * -16;
        el.style.setProperty('--parallax', shift.toFixed(2));
      });
    };
    window.addEventListener('scroll', updateParallax, { passive: true });
    updateParallax();
  }

  // Hero entrance: fires once on load, not on scroll (it's the first thing the visitor sees)
  window.addEventListener('load', () => {
    if (prefersReducedMotion) {
      document.getElementById('hero-h1').classList.add('in');
      document.getElementById('hero-lede').classList.add('in');
      document.getElementById('hero-cta').classList.add('in');
      return;
    }
    requestAnimationFrame(() => {
      document.getElementById('hero-h1').classList.add('in');
      document.getElementById('hero-lede').classList.add('in');
      document.getElementById('hero-cta').classList.add('in');
    });
  });
</script>

</body>
</html>
